<style>
/* Layout: buscador de stock para el pulgar — barra con búsqueda siempre a mano, rubros en grilla de íconos, resultados en lista o grilla, ficha con link propio. */
:root {
  --navy: #00508A;   /* azul del logo */
  --night: #0F1B2D;
  --gold: #7ABB4C;   /* verde del logo (acentos) */
  --amarillo: #FFC83D;
  --green: #1F8A3B;
  --green-deep: #17702F;
  --red: #D62839;
  --paper: #F2F5F9;
  --card: #FFFFFF;
  --ink: #13233A;
  --muted: #5B6B80;
  --faint: #8A98AA;
  --line: #E4E9F0;
  --font: 'Archivo', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --wide: 'Archivo', 'Arial Black', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button, input, select { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Barra */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; height: 62px; }
.logo { height: 30px; width: auto; flex-shrink: 0; mix-blend-mode: multiply; display: block; }
.search { flex: 1 1 auto; min-width: 0; position: relative; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--paper); padding: 0 36px 0 40px; font-size: 16px; font-weight: 600; -webkit-appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: 2px solid var(--navy); background: var(--card); }
.search .lupa { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
.search .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }

main { padding-block: 16px 120px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 25px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.4px; line-height: 1.15; color: var(--night); text-wrap: balance; }
.sub { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.label { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

/* Inicio: rubros con portada */
.vitrina { position: relative; border-radius: 26px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F6FB 100%); overflow: hidden; box-shadow: 0 1px 2px rgba(19, 35, 58, 0.05); }
.vt-cab { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px; padding: 14px 16px 0; color: var(--ink); }
.vt-cab h2 { grid-column: 1; margin: 0; font-size: 24px; font-weight: 900; font-stretch: 122%; letter-spacing: -1px; line-height: 1; color: var(--navy); }
.vt-cab .vt-n { grid-column: 2; grid-row: 1; font-size: 13px; font-weight: 600; color: var(--muted); }
.vt-cab .vt-ver { grid-column: 4; grid-row: 1; align-self: center; padding: 7px 12px; border-radius: 999px; background: var(--paper); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 800; color: var(--navy); }
.mesa { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 10px 6px 12px; background: linear-gradient(180deg, transparent 0 94px, #DCE7F2 94px, #E9F0F7 100%); }
.mesa::-webkit-scrollbar { display: none; }
.mesa button { flex: 0 0 30%; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 4px; border: 0; background: none; font: inherit; color: var(--ink); cursor: pointer; }
.mesa .eq { position: relative; height: 88px; width: 100%; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 10px; }
.mesa .eq::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -5px; height: 9px; border-radius: 50%; background: radial-gradient(closest-side, rgba(11, 30, 52, 0.38), rgba(11, 30, 52, 0)); }
.mesa .eq img { position: relative; z-index: 1; max-height: 88px; max-width: 100%; object-fit: contain; transition: transform 0.35s cubic-bezier(.2, .8, .2, 1); }
.mesa b { white-space: nowrap; font-size: 14px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.2px; }
.mesa small { font-size: 12px; font-weight: 600; color: var(--muted); }
.mesa button:active .eq img { transform: translateY(-4px) scale(0.98); }
@media (hover: hover) { .mesa button:hover .eq img { transform: translateY(-8px); } .mesa button:hover b { color: var(--navy); } }
@media (min-width: 700px) {
  .vt-cab { padding: 22px 30px 0; } .vt-cab h2 { font-size: 34px; }
  .mesa { overflow: visible; padding: 18px 16px 20px; background: linear-gradient(180deg, transparent 0 190px, #DCE7F2 190px, #E9F0F7 100%); }
  .vt-cab { grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: baseline; } .vt-cab .vt-n { grid-column: 2; grid-row: 1; } .vt-cab .vt-ver { grid-column: 4; grid-row: 1; }
  .mesa button { flex: 1 1 0; }
  .mesa .eq { height: 210px; } .mesa .eq img { max-height: 210px; }
  .mesa b { font-size: 18px; }
}
.tile { position: relative; display: flex; flex-direction: column; border-radius: 22px; padding: 12px 12px 12px 14px; background: var(--tint, #E3ECF7); color: var(--night); }
.tile .tim { position: relative; display: grid; place-items: center; height: 128px; margin: 2px 0 2px; }
.tile .tim::before { content: ""; position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; border-radius: 50%; background: rgba(255, 255, 255, 0.62); transform: translate(-50%, -50%); }
.tile .tim img { position: relative; display: block; max-width: min(128px, 92%); max-height: 98px; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 10px 9px rgba(15, 27, 45, 0.24)); }
.tile .tim .ico-big { position: relative; width: 64px; height: 64px; border-radius: 18px; background: rgba(255, 255, 255, 0.85); display: flex; align-items: center; justify-content: center; color: var(--navy); }
.tile .tpie { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; row-gap: 2px; margin-top: auto; }

function dist(a, b) { if (Math.abs(a.length - b.length) > 1) return 2; const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, i) => i); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
const palabras = t => norm(t).split(/\s+/).filter(Boolean);
DATA.productos.forEach(p => { const r = RUBRO[p.rubro] || {}; p._n = palabras([p.nombre, p.det, p.sub, r.nombre].join(' ')); p._w = [...p._n, ...palabras(r.claves || '')]; });
// búsqueda específica: primero por nombre, detalle, subrubro y rubro; las palabras clave del rubro solo si así no aparece nada
function buscarProductos(q) { const ps = DATA.productos.filter(p => coincide(p, q, '_n')); return ps.length ? ps : DATA.productos.filter(p => coincide(p, q, '_w')); }
function coincide(p, q, campo = '_w') {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  return toks.every(t => {
    const alts = [t, ...(SIN[t] ? SIN[t].split(' ') : [])];
    return alts.some(a => p[campo].some(w => w.startsWith(a) || (a.length >= 4 && dist(a, w.slice(0, a.length)) <= 1)));
  });
}

function ordenar(ps) {
  const c = [...ps];
  const pv = p => p.precio == null ? Infinity : p.precio;
  if (orden === 'precio-asc') c.sort((a, b) => pv(a) - pv(b));
  if (orden === 'precio-desc') c.sort((a, b) => (b.precio ?? -1) - (a.precio ?? -1));
  if (orden === 'nombre') c.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  c.sort((a, b) => !!a.estado - !!b.estado);   // vendidos y agotados, al final
  return c;
}

function montarVidriera() {
  const el = $('vid'); if (!el) return;
  const sl = vidSlides(), T = 4200, quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = 0, pausa = false, t0 = 0;
  el.style.setProperty('--vt', T + 'ms');
  const barras = [...el.querySelectorAll('.vbar i')];
  const pintar = (i, primera) => {
    const v = sl[i];
    barras.forEach((b, j) => { b.className = j < i ? 'ok' : ''; b.firstChild.style.animation = 'none'; void b.offsetWidth; b.firstChild.style.animation = ''; });
    if (barras[i]) barras[i].className = 'ya';
    el.style.setProperty('--vbg', v.fondo);
    $('vid-link').href = '#p-' + v.id;
    $('vid-ver').innerHTML = `${vidPrecio(v)} ${ico('chev', 14, 2.6)}`;
    $('vid-tag').textContent = v.tag;
    if (primera) return;
    const rol = $('vid-rol'), viejo = rol.querySelector('span:not(.sale)');
    if (viejo) { viejo.className = 'sale'; setTimeout(() => viejo.remove(), 420); }
    rol.insertAdjacentHTML('beforeend', `<span class="entra">${esc(v.corto)}</span>`);
    const caja = $('vid-img'), vi = caja.querySelector('img:not(.sale)');
    if (vi) { vi.className = 'sale'; setTimeout(() => vi.remove(), 460); }
    caja.insertAdjacentHTML('beforeend', `<img src="${v.rec}" alt="" class="entra">`);
    el.classList.add('cambia'); setTimeout(() => el.classList.remove('cambia'), 900);
  };
  const ir = d => { k = (k + d + sl.length) % sl.length; pintar(k); t0 = performance.now(); };
  pintar(0, true); t0 = performance.now();
  clearInterval(vidTimer);
  if (sl.length > 1 && !quieto) vidTimer = setInterval(() => {
    if (!document.body.contains(el)) { clearInterval(vidTimer); return; }
    if (!pausa && performance.now() - t0 >= T) ir(1);
  }, 120);
  // tocar y mantener = pausa; deslizar = pasar
  let x0 = null, y0 = 0, tp = 0, desliz = false;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; tp = performance.now(); pausa = true; el.classList.add('pausa'); });
  const soltar = e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0, dt = performance.now() - tp;

}

const icoSp = k => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO_SP[k]}</svg>`;
function fichaSpecs(f, det) {
  const tr = f.traseras || [], ppal = tr[0] ? tr[0][0] : '';
  const alm = ((det || '').match(/(\d+)\s?(GB|TB)(?!\s*RAM)/i) || []), ram = ((det || '').match(/(\d+)\s?GB\s*RAM/i) || [])[1];
  const num = (v, u) => `<b>${esc(v)}${u ? `<i>${esc(u)}</i>` : ''}</b>`;
  const pant = String(f.pantalla).replace('"', '');
  const mp = s2 => String(s2).replace(/\s*MP$/i, '');
  const bat = f.bat_nota === 'mAh' ? num(f.bateria, 'mAh') : `<b><i class="pre">hasta</i>${esc(String(f.bateria).replace(/^Hasta\s+/i, '').replace(/\s*h$/, ''))}<i>h</i></b>`;
  const stats = [['pantalla', `<b>${esc(pant)}<i class="in">"</i></b>`, 'Pantalla'], ppal ? ['camara', num(mp(ppal), 'MP'), 'Cámara'] : null, ['bateria', bat, f.bat_nota === 'mAh' ? 'Batería' : 'Autonomía']].filter(Boolean);
  const memo = [alm[1] ? ['disco', alm[1], alm[2].toUpperCase(), 'Almacenamiento'] : null, ram ? ['chip', ram, 'GB', 'Memoria RAM'] : null].filter(Boolean);
  const modulo = n => `<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><rect x="2" y="2" width="42" height="42" rx="12" fill="#DCE6F1" stroke="#C3D0DE"/>${(n >= 3 ? [[15, 15, 8], [15, 31, 8], [31, 23, 8]] : n === 2 ? [[15, 15, 8.5], [15, 31, 8.5]] : [[17, 17, 10]]).map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#0B1522" stroke="#8796A8" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r * 0.45}" fill="#1D3550"/><circle cx="${x - r * 0.3}" cy="${y - r * 0.3}" r="${r * 0.16}" fill="#9CC3F0" opacity=".8"/>`).join('')}</svg>`;
  const lente = `<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="17" fill="#0B1522" stroke="#C3D0DE" stroke-width="4"/><circle cx="23" cy="23" r="7.5" fill="#1D3550"/><circle cx="18.5" cy="18.5" r="2.6" fill="#9CC3F0" opacity=".8"/></svg>`;
  const tipos = tr.map(([, t]) => t.charAt(0).toUpperCase() + t.slice(1));
  return `<section class="specs" aria-label="Características">
    <p class="ey">Características</p>
    ${memo.length ? `<div class="spclave n${memo.length}">${memo.map(([k, v, u, l]) => `<div><span class="si">${icoSp(k)}</span><span class="sv"><small>${l}</small><b>${esc(v)}<i>${u}</i></b></span></div>`).join('')}</div>` : ''}
    <div class="sp3">${stats.map(([k, v, l]) => `<div><span class="si">${icoSp(k)}</span>${v}<small>${l}</small></div>`).join('')}</div>
    ${tr.length || f.frontal ? `<div class="cams"><p class="ey">Cámaras</p><div class="camcards">
      ${tr.length ? `<div class="camc">${modulo(tr.length)}<div><small>${tr.length > 1 ? 'Traseras' : 'Trasera'}</small><b>${tr.map(([m]) => esc(mp(m))).join('<span class="mas">+</span>')}<i>MP</i></b><span class="tp">${esc(tipos.join(' + '))}</span></div></div>` : ''}
      ${f.frontal ? `<div class="camc">${lente}<div><small>Frontal</small><b>${esc(mp(f.frontal))}<i>MP</i></b><span class="tp">Selfie</span></div></div>` : ''}
    </div></div>` : ''}
  </section>`;
}
function vFicha(p) {
  const r = RUBRO[p.rubro];
  const otros = ordenar(DATA.productos.filter(x => x.rubro === p.rubro && x.id !== p.id && (x.sub === p.sub || !p.sub))).slice(0, 4);
  const pr = fmt(p.precio), est = EST_TXT[p.estado];
  const msg = est ? `Hola TODO PC! Vi en la web ${p.nombre}${p.det ? ' (' + p.det + ')' : ''}, que figura ${p.estado}. ¿Tienen uno similar? ${linkProd(p)}` : `Hola TODO PC! Me interesa: ${p.nombre}${p.det ? ' (' + p.det + ')' : ''}.${pr ? ' Precio en la web: ' + pr + '.' : ''} ${linkProd(p)}`;
  const ctaTxt = est ? (p.estado === 'vendido' ? 'Consultar por uno similar' : 'Avisame cuando vuelva') : p.tag === 'ingresa' ? 'Avisame' : 'Consultar por WhatsApp';
  vista.innerHTML = `
    <article class="ficha">
      <a class="crumb" href="#${r.id}">${ico('back', 18, 2.4)}${esc(r.nombre)}${p.sub ? ' · ' + esc(p.sub) : ''}</a>
      <div class="fgrid"><div class="fcol1"><div class="foto${p.estado ? ' con-estado' : ''}">${p.foto ? `<img src="${p.foto}" alt="${esc(p.nombre)}">` : `<div class="ph-vacio" style="width:50%;height:50%">${ico(p.rubro, 56, 1.5)}</div>`}${estadoFoto(p)}</div></div>
      <div class="fcol2">
      <div class="rh">
        <div class="datos">${badge(p)}<h1>${esc(p.nombre)}</h1>${p.det ? `<span class="dt">${esc(p.det)}</span>` : ''}
          ${est ? `${pr ? `<span class="pr tachado">${pr}</span>` : ''}<div class="est-aviso ${p.estado}">${p.estado === 'vendido' ? 'Este equipo ya se vendió. Escribinos y te ofrecemos uno similar.' : 'Agotado por ahora. Escribinos y te avisamos cuando vuelva.'}</div>` : pr ? `<span class="pr">${pr}</span><span class="cq">Contado / transferencia</span><span class="como">Te confirmamos stock por WhatsApp.</span>` : `<span class="pr sin" style="font-size:18px">${p.tag === 'ingresa' ? 'Ingresa muy pronto' : 'Consultá el precio'}</span>`}</div>
        <button class="icon-btn" type="button" id="share" aria-label="Copiar link de este producto">${ico('share', 20)}</button>
      </div>
      ${p.rubro === 'celulares' && !est ? promoCel(p.sub) : ''}
      ${pr && !est ? `<div class="pagos"><b>También en 3, 6 y 12 cuotas</b><div class="logos">${LOGOS.map(l => `<img src="${l.src}" alt="${l.alt}">`).join('')}</div></div>` : ''}
      <a class="cta cta-in" href="${wa(msg)}" target="_blank" rel="noopener">${ICO_WA}${ctaTxt}</a>
      ${p.specs ? fichaSpecs(p.specs, p.det) : ''}
      </div></div>
    </article>
    ${otros.length ? `<section><p class="label">Más en ${esc(p.sub || r.nombre)}</p><div class="list">${otros.map(itemLista).join('')}</div></section>` : ''}
    <div class="buy"><div class="wrap">
      <div class="mini"><span>${esc(p.nombre)}</span><b>${est || pr || (p.tag === 'ingresa' ? 'Muy pronto' : 'Consultar')}</b></div>
      <a class="cta" href="${wa(msg)}" target="_blank" rel="noopener">${ICO_WA}${ctaTxt}</a>
    </div></div>`;
  $('share').onclick = () => copiar(linkProd(p), 'Link del producto copiado');
}

function copiar(t, m) { try { navigator.clipboard.writeText(t).then(() => toast(m)).catch(() => toast(t)); } catch (e) { toast(t); } }
let tt;
function toast(m) { const el = $('toast'); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2400); }

function router() {
  const h = location.hash.slice(1) || 'inicio';
  buscar.value = ''; $('limpiar').hidden = true;
  const tabSel = h.startsWith('p-') || h.startsWith('tomamos') ? '' : (h === 'inicio' ? 'inicio' : 'rubros');
  ['inicio', 'rubros'].forEach(k => { const el = $('tab-' + k); if (k === tabSel) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current'); });
  vista.style.paddingBottom = h.startsWith('p-') ? '200px' : '';
  if (h.startsWith('p-') && BY_ID[h.slice(2)]) vFicha(BY_ID[h.slice(2)]);
  else if (h.startsWith('tomamos')) vTomamos(h);
  else if (h === 'rubros') vRubros();
  else if (RUBRO[h]) vRubro(h);
  else vInicio();
  window.scrollTo(0, 0);
}
let tq;
buscar.addEventListener('input', () => {
  const q = buscar.value.trim();
  $('limpiar').hidden = !q;
  clearTimeout(tq);
  tq = setTimeout(() => { if (q.length >= 2) { vBuscar(q); window.scrollTo(0, 0); } else if (!q) router(); }, 150);
});
$('limpiar').onclick = () => { buscar.value = ''; $('limpiar').hidden = true; router(); buscar.focus(); };
window.addEventListener('hashchange', () => { subSel = marcaPend || 'Todos'; marcaPend = null; router(); });
router();
</script>
