<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Catálogo TODO PC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: buscador de stock para el pulgar — barra con búsqueda siempre a mano, rubros en grilla de íconos, resultados en lista o grilla, ficha con link propio. */
:root {
  --navy: #17406B;
  --night: #0F1B2D;
  --gold: #FFC83D;
  --green: #1F8A3B;
  --green-deep: #17702F;
  --red: #D62839;
  --paper: #F2F5F9;
  --card: #FFFFFF;
  --ink: #13233A;
  --muted: #5B6B80;
  --faint: #8A98AA;
  --line: #E4E9F0;
  --font: 'Archivo', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --wide: 'Archivo', 'Arial Black', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button, input, select { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Barra */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; height: 62px; }
.logo { height: 30px; width: auto; flex-shrink: 0; mix-blend-mode: multiply; display: block; }
.search { flex: 1 1 auto; min-width: 0; position: relative; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--paper); padding: 0 36px 0 40px; font-size: 16px; font-weight: 600; -webkit-appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: 2px solid var(--navy); background: var(--card); }
.search .lupa { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
.search .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }

main { padding-block: 16px 120px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 25px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.4px; line-height: 1.15; color: var(--night); text-wrap: balance; }
.sub { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.label { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

/* Inicio: rubros con portada */
.celcard { border-radius: 24px; background: #DCE8F7; color: var(--night); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.celcard .cc-top { display: grid; grid-template-columns: minmax(0, 1fr) 128px; align-items: center; gap: 8px; color: inherit; }
.celcard .cc-txt b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.05; }
.celcard .cc-txt small { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; color: rgba(15, 27, 45, 0.62); }
.celcard .cc-ver { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 9px 14px; border-radius: 999px; background: var(--night); color: #FFFFFF; font-size: 14px; font-weight: 800; }
.celcard .cc-img { position: relative; height: 118px; }
.celcard .cc-img img { position: absolute; bottom: 0; height: 112px; width: auto; filter: drop-shadow(0 10px 9px rgba(15, 27, 45, 0.28)); }
.celcard .cc-img img:nth-child(1) { right: 34px; transform: rotate(-9deg); height: 98px; opacity: 0.92; }
.celcard .cc-img img:nth-child(2) { right: 0; z-index: 2; }
.celcard .cc-marcas { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.celcard .cc-marcas button { grid-column: span 2; }
.celcard .cc-marcas.n5 button:nth-child(n+4), .celcard .cc-marcas.n4 button { grid-column: span 3; }
.celcard .cc-marcas button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 12px; border: 0; border-radius: 14px; background: #FFFFFF; color: var(--night); font: inherit; box-shadow: 0 1px 2px rgba(15, 27, 45, 0.06); text-align: left; cursor: pointer; }
.celcard .cc-marcas button span { font-size: 15px; font-weight: 800; }
.celcard .cc-marcas button small { font-size: 12px; font-weight: 600; color: rgba(15, 27, 45, 0.55); }
.celcard .cc-marcas button:active { transform: scale(0.98); }
.tile { position: relative; display: flex; flex-direction: column; border-radius: 22px; padding: 12px 12px 12px 14px; background: var(--tint, #E3ECF7); color: var(--night); }
.tile .tim { position: relative; display: grid; place-items: center; height: 128px; margin: 2px 0 2px; }
.tile .tim::before { content: ""; position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; border-radius: 50%; background: rgba(255, 255, 255, 0.62); transform: translate(-50%, -50%); }
.tile .tim img { position: relative; display: block; max-width: min(128px, 92%); max-height: 98px; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 10px 9px rgba(15, 27, 45, 0.24)); }
.tile .tim .ico-big { position: relative; width: 64px; height: 64px; border-radius: 18px; background: rgba(255, 255, 255, 0.85); display: flex; align-items: center; justify-content: center; color: var(--navy); }
.tile .tpie { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; row-gap: 2px; margin-top: auto; }
.tile b { grid-column: 1 / -1; min-height: 2.24em; display: flex; align-items: flex-end; font-size: 16px; font-weight: 800; letter-spacing: -0.2px; line-height: 1.12; text-wrap: balance; }
.tile small { font-size: 13px; font-weight: 600; color: rgba(15, 27, 45, 0.62); }
.tile .go { width: 30px; height: 30px; border-radius: 50%; background: var(--night); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.tile:active { transform: scale(0.985); }
@media (max-width: 699px) {
  .tile.ult { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 12px; min-height: 0; }
  .tile.ult .tim { flex: 0 0 46%; margin: 0; height: 118px; }
  .tile.ult .tpie { flex: 1 1 auto; margin: 0; }
  .tile.ult b { min-height: 0; }
}
/* Vidriera de celulares */
.vidriera { position: relative; border-radius: 24px; background: var(--vbg, var(--navy)); color: #FFFFFF; padding: 16px 16px 14px 18px; overflow: hidden; isolation: isolate; transition: background-color 0.7s ease; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.vidriera .vsol { position: absolute; left: 50%; top: 50%; width: var(--sol, 156px); height: var(--sol, 156px); margin: calc(var(--sol, 156px) / -2) 0 0 calc(var(--sol, 156px) / -2); border-radius: 50%; background: var(--gold); transition: transform 0.9s cubic-bezier(.2,.8,.2,1); }
.vidriera .vsol::after { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.28); animation: vgira 26s linear infinite; }
.vidriera.cambia .vsol { transform: scale(1.12) rotate(18deg); }
.vidriera .vbar { display: flex; gap: 4px; margin: 0 4px 12px 0; position: relative; z-index: 3; }
.vidriera .vbar i { flex: 1 1 0; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.28); overflow: hidden; }
.vidriera .vbar i b { display: block; height: 100%; width: 0; background: #FFFFFF; border-radius: inherit; }
.vidriera .vbar i.ok b { width: 100%; }
.vidriera .vbar i.ya b { animation: vllena var(--vt, 4s) linear forwards; }
.vidriera.pausa .vbar i.ya b { animation-play-state: paused; }
.vidriera .vcuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 44%; align-items: center; min-height: 118px; }
.vidriera .vt { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 2; }
.vidriera h2 { margin: 0; font-size: 25px; font-weight: 900; font-stretch: 116%; line-height: 1.02; letter-spacing: -0.5px; }
.vidriera h2 .vrol { display: block; position: relative; height: 1.08em; overflow: hidden; }
.vidriera h2 .vrol span { position: absolute; left: 0; top: 0; white-space: nowrap; color: var(--gold); }
.vidriera h2 .vrol span.entra { animation: ventra 0.55s cubic-bezier(.2,.9,.25,1.15) both; }
.vidriera h2 .vrol span.sale { animation: vsale 0.4s ease-in both; }
.vidriera .vver { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, 0.86); }
.vidriera .vimg { position: relative; height: 140px; margin: -6px 0 0; }
.vidriera .vimg img { position: absolute; inset: 0; margin: auto; z-index: 1; max-width: 86%; max-height: 82%; object-fit: contain; filter: drop-shadow(0 14px 12px rgba(5, 12, 25, 0.42)); }
.vidriera .vimg img.entra { animation: vimgin 0.7s cubic-bezier(.2,.9,.25,1.1) both, vflota 3.6s ease-in-out 0.7s infinite; }
.vidriera .vimg img.sale { animation: vimgout 0.45s ease-in both; }
.vidriera .vbot { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px; min-height: 46px; }
.vidriera .vbot button { min-width: 0; height: 46px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.13); color: #FFFFFF; font-size: 13px; font-weight: 800; letter-spacing: -0.2px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 0 2px; text-align: center; cursor: pointer; animation: vbotin 0.45s ease both; }
.vidriera .vbot button span, .vidriera .vbot button small { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vidriera .vbot button small { font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.72); }
.vidriera .vbot button.todo { background: #FFFFFF; color: var(--night); }
.vidriera .vbot button.todo small { color: var(--muted); }
.vidriera .vbot button:nth-child(2) { animation-delay: 0.05s; } .vidriera .vbot button:nth-child(3) { animation-delay: 0.1s; } .vidriera .vbot button:nth-child(4) { animation-delay: 0.15s; }
@keyframes vllena { to { width: 100%; } }
@keyframes ventra { from { transform: translateY(105%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vsale { to { transform: translateY(-105%); opacity: 0; } }
@keyframes vimgin { from { transform: translateX(46%) rotate(14deg) scale(0.7); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vimgout { to { transform: translateX(-38%) rotate(-10deg) scale(0.75); opacity: 0; } }
@keyframes vflota { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-1.5deg); } }
@keyframes vbotin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vgira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .vidriera *, .vidriera *::after { animation: none !important; transition: none !important; } .vidriera .vbar i.ya b { width: 100%; } }
@media (min-width: 700px) { .vidriera { padding: 22px 28px 20px; } .vidriera h2 { font-size: 36px; } .vidriera .vcuerpo { grid-template-columns: minmax(0, 1fr) 300px; min-height: 160px; } .vidriera .vimg { height: 190px; --sol: 210px; } .vidriera .vbot { grid-template-columns: repeat(4, minmax(0, 160px)); }  }
.rban { position: relative; min-height: 132px; border-radius: 24px; background: var(--tint); padding: 18px 16px 16px; display: flex; align-items: flex-end; overflow: hidden; isolation: isolate; }
.rban::before { content: ""; position: absolute; z-index: -1; width: 170px; height: 170px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); right: -20px; bottom: -60px; }
.rban .rbt { max-width: 58%; }
.rban h1 { font-size: 27px; }
.rban .sub { color: rgba(15, 27, 45, 0.65); }
.rban img { position: absolute; right: 10px; bottom: 8px; height: 112px; max-width: 40%; object-fit: contain; filter: drop-shadow(0 10px 10px rgba(15, 27, 45, 0.25)); }
.rban .icon-btn { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.85); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
/* Inicio: rubros */
.rubros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; }
@media (min-width: 700px) { .rubros { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.rubro { display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; font-size: 12.5px; font-weight: 700; line-height: 1.2; color: var(--ink); }
.rubro .ic { width: 100%; max-width: 72px; aspect-ratio: 1 / 1; border-radius: 20px; background: var(--card); color: var(--navy); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(19, 35, 58, 0.06); }
.rubro:active .ic { background: var(--night); color: var(--gold); }
.recent { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; overflow: hidden; }

.all-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 52px; padding: 0 14px 0 16px; border-radius: 16px; background: var(--card); font-size: 15px; font-weight: 800; color: var(--night); margin-top: 8px; }
.all-btn span { display: inline-flex; align-items: center; gap: 10px; }
.all-btn em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
.rlist { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; overflow: hidden; }
.rrow { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; min-height: 68px; border-top: 1px solid var(--line); }
.rrow:first-child { border-top: 0; }
.rrow:active { background: var(--paper); }
.rrow .ic { flex-shrink: 0; width: 52px; height: 52px; border-radius: 13px; background: var(--tint, var(--paper)); color: var(--navy); display: flex; align-items: center; justify-content: center; }
.rrow .ic:has(img) { padding: 3px; }
.rrow .ic img { width: 100%; height: 100%; object-fit: contain; }
.rrow .tx { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rrow b { font-size: 15px; font-weight: 800; color: var(--night); }
.rrow small { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .n { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--faint); }
/* Rubro: encabezado y herramientas */
.rh { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.icon-btn { flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--card); color: var(--navy); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 2px rgba(19, 35, 58, 0.08); }
.subs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.subs::-webkit-scrollbar { display: none; }
.subs button { flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--card); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: inset 0 0 0 1.5px var(--line); }
.subs button[aria-pressed="true"] { background: var(--night); color: #FFFFFF; box-shadow: none; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sort { position: relative; }
.sort select { -webkit-appearance: none; appearance: none; height: 38px; border: 0; border-radius: 10px; background: var(--card); padding: 0 34px 0 12px; font-size: 14px; font-weight: 700; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; }
.sort svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
.view { display: flex; background: var(--card); border-radius: 10px; padding: 3px; box-shadow: inset 0 0 0 1.5px var(--line); }
.view button { width: 40px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--faint); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.view button[aria-pressed="true"] { background: var(--paper); color: var(--night); }
.promo { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 9px; border-radius: 14px; background: repeating-linear-gradient(-45deg, var(--red) 0 16px, #E03548 16px 32px); color: #FFFFFF; font-size: 13px; font-weight: 700; line-height: 1.3; }
.promo .st { flex-shrink: 0; background: var(--gold); color: var(--night); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 800; font-style: italic; text-transform: uppercase; transform: rotate(-3deg); }
.promo b { color: var(--gold); padding: 0 2px; }
.nota { font-size: 13px; font-weight: 600; color: #6B5310; background: #FFF4D1; border-radius: 12px; padding: 10px 12px; }

/* Lista */
.list { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 12px; min-height: 108px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item:active { background: var(--paper); }
.item .ph { flex-shrink: 0; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
.item .ph img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.item .bd { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nm { font-size: 15px; font-weight: 700; line-height: 1.25; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dt { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; color: var(--navy); font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; }
.pr.sin { font-size: 14px; letter-spacing: 0; color: var(--muted); font-weight: 700; }
.chev { flex-shrink: 0; color: #B6C1CE; }
.badge { align-self: flex-start; height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 2px; }
.badge.usado { background: #E6EEF7; color: var(--navy); }
.badge.ingresa { background: var(--gold); color: var(--night); }
.badge.ejemplo { background: var(--paper); color: var(--muted); }
.ph-vacio { width: 78%; height: 78%; border-radius: 16px; background: var(--paper); display: flex; align-items: center; justify-content: center; color: #A7B3C2; }

/* Grilla */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } }
.card { display: flex; flex-direction: column; background: var(--card); border-radius: 16px; overflow: hidden; min-width: 0; }
.card:active { transform: scale(0.98); }
.card .ph { aspect-ratio: 1 / 1; max-width: 100%; display: flex; align-items: center; justify-content: center; padding: 12px 12px 2px; }
.card .ph img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.card .bd { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; }
.card .pr { margin-top: auto; padding-top: 6px; font-size: 18px; }
.card .pr.sin { font-size: 13px; }

/* Ficha */
.ficha { display: flex; flex-direction: column; gap: 16px; }
.ficha .foto { background: var(--card); border-radius: 22px; aspect-ratio: 1 / 1; max-width: 100%; max-height: 46vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.ficha .foto img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.ficha .datos { display: flex; flex-direction: column; gap: 4px; }
.ficha h1 { font-size: 24px; }
.ficha .dt { font-size: 14px; white-space: normal; }
.ficha .pr { font-size: 34px; letter-spacing: -1px; margin-top: 8px; line-height: 1; }
.ficha .cq { font-size: 13.5px; font-weight: 700; color: var(--green); }
.pagos { display: flex; flex-direction: column; gap: 10px; background: var(--card); border-radius: 16px; padding: 14px; }
.pagos b { font-size: 14px; font-weight: 800; }
.logos { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.logos img { height: 22px; width: auto; mix-blend-mode: multiply; }
.buy { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.buy .wrap { display: flex; align-items: center; gap: 12px; }
.buy .mini { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
.buy .mini span { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buy .mini b { font-size: 18px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
.cta { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 18px; border-radius: 14px; background: var(--green); color: #FFFFFF; font-size: 15.5px; font-weight: 800; }
.cta:active { background: var(--green-deep); }

.vacio { padding: 28px 18px; border-radius: 18px; background: var(--card); text-align: center; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 14px; align-items: center; }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 24; width: 54px; height: 54px; border-radius: 999px; background: var(--green); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(23, 112, 47, 0.35); }

.sugs { align-items: center; }
.sug-t { flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.sugs button { height: 34px; font-size: 13.5px; }
.ficha .como { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.35; margin-top: 4px; max-width: 34ch; }
.lcard { background: var(--card); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.lf { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35; color: var(--night); }
.lf .li { width: 22px; flex-shrink: 0; text-align: center; }
.lf b { display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.lbtn { display: flex; gap: 8px; margin-top: 2px; }
.lbtn a { flex: 1 1 0; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14.5px; font-weight: 800; }
.btn-sec { background: var(--paper); color: var(--navy); box-shadow: inset 0 0 0 1px var(--line); }
.btn-wa { background: var(--green); color: #FFFFFF; }
footer { background: var(--night); color: #FFFFFF; position: relative; }
footer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--gold) 0 12px, var(--night) 12px 24px); }
.foot { padding-block: 26px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; }
.foot b { font-size: 15px; font-weight: 800; }
.foot span { font-size: 13px; color: rgba(255, 255, 255, 0.72); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--night); color: #FFFFFF; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Barra inferior fija */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); box-shadow: 0 -4px 16px rgba(19, 35, 58, 0.06); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab[aria-current="page"] { color: var(--night); }
.tab[aria-current="page"] svg { color: var(--navy); }
.tab.wa-tab { color: var(--green); }
.tab:active { background: var(--paper); }
.crumb { display: inline-flex; align-self: flex-start; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--card); font-size: 15px; font-weight: 800; color: var(--navy); box-shadow: 0 1px 2px rgba(19, 35, 58, 0.08); }
.buy { bottom: calc(65px + env(safe-area-inset-bottom, 0px)) !important; padding-block: 10px !important; box-shadow: 0 -4px 16px rgba(19, 35, 58, 0.06); }
</style>

/* Búsqueda tolerante */
const SIN = { ruter: 'router', ruters: 'router', wifi: 'router repetidor wifi', celu: 'celular', celus: 'celular', cel: 'celular', telefono: 'celular', compu: 'pc notebook', impresora: 'impresora', tinta: 'cartucho', toner: 'toner', auricular: 'auriculares', parlante: 'parlantes', cargador: 'cargador', caja: 'caja fuerte', billetes: 'contadora' };
function dist(a, b) { if (Math.abs(a.length - b.length) > 1) return 2; const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, i) => i); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
const palabras = t => norm(t).split(/\s+/).filter(Boolean);
DATA.productos.forEach(p => { const r = RUBRO[p.rubro] || {}; p._n = palabras([p.nombre, p.det, p.sub, r.nombre].join(' ')); p._w = [...p._n, ...palabras(r.claves || '')]; });
// búsqueda específica: primero por nombre, detalle, subrubro y rubro; las palabras clave del rubro solo si así no aparece nada
function buscarProductos(q) { const ps = DATA.productos.filter(p => coincide(p, q, '_n')); return ps.length ? ps : DATA.productos.filter(p => coincide(p, q, '_w')); }
function coincide(p, q, campo = '_w') {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  return toks.every(t => {
    const alts = [t, ...(SIN[t] ? SIN[t].split(' ') : [])];
    return alts.some(a => p[campo].some(w => w.startsWith(a) || (a.length >= 4 && dist(a, w.slice(0, a.length)) <= 1)));
  });
}

function ordenar(ps) {
  const c = [...ps];
  const pv = p => p.precio == null ? Infinity : p.precio;
  if (orden === 'precio-asc') c.sort((a, b) => pv(a) - pv(b));
  if (orden === 'precio-desc') c.sort((a, b) => (b.precio ?? -1) - (a.precio ?? -1));
  if (orden === 'nombre') c.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  return c;
}

const itemGrilla = p => `<a class="card" href="#p-${p.id}"><div class="ph">${foto(p, 34)}</div><div class="bd">${badge(p)}<span class="nm">${esc(p.nombre)}</span>${p.det ? `<span class="dt">${esc(p.det)}</span>` : ''}${precio(p)}</div></a>`;
const resultados = ps => vistaModo === 'grilla' ? `<section class="grid">${ps.map(itemGrilla).join('')}</section>` : `<section class="list">${ps.map(itemLista).join('')}</section>`;
const promoCel = sub => sub === 'Usados'
  ? `<div class="promo"><span class="st">Incluye</span><span>Caja<b>+</b>Cargador<b>+</b>Vidrio<b>+</b>Funda<b>+</b>Garantía</span></div>`
  : `<div class="promo"><span class="st">¡De regalo!</span><span>Cargador original<b>+</b>Vidrio templado<b>+</b>Funda</span></div>`;
const herramientas = () => `<div class="tools">
  <label class="sort"><span class="sr">Ordenar</span><select id="orden">
    <option value="precio-asc" ${orden === 'precio-asc' ? 'selected' : ''}>Menor precio</option>
    <option value="precio-desc" ${orden === 'precio-desc' ? 'selected' : ''}>Mayor precio</option>
    <option value="nombre" ${orden === 'nombre' ? 'selected' : ''}>Nombre A-Z</option>
  </select>${ico('down', 16, 2.4)}</label>
  <div class="view" role="group" aria-label="Vista">
    <button type="button" data-v="lista" aria-pressed="${vistaModo === 'lista'}" aria-label="Ver en lista">${ico('lista', 18)}</button>
    <button type="button" data-v="grilla" aria-pressed="${vistaModo === 'grilla'}" aria-label="Ver en grilla">${ico('grilla', 18)}</button>
  </div></div>`;
function conectarHerramientas(redibujar) {
  $('orden').onchange = e => { orden = e.target.value; redibujar(); };
  vista.querySelectorAll('.view button').forEach(b => b.onclick = () => { vistaModo = b.dataset.v; pref.set('tp-vista', vistaModo); redibujar(); });
}

/* Datos del local (lo que tranquiliza al que compra por primera vez) */
const LOCAL = {
  direccion: 'Pte. Raúl Alfonsín 777 · Helvecia, Santa Fe',
  mapa: 'https://www.google.com/maps/search/?api=1&query=Todo+PC+Helvecia&query_place_id=ChIJlZiuTgC9tJUR8YFxkmhccr8',
  horario: '',
  pagos: 'Efectivo, transferencia y tarjetas en 3, 6 y 12 cuotas',
  envios: '',
};
const SUGERENCIAS = ['mouse', 'cargador', 'iPhone', 'tinta Epson', 'pendrive', 'parlante JBL', 'cámara', 'Samsung'];
/* Vidriera animada: "Tu próximo ___" rota entre los rubros fuertes, como historias */
const VIDRIERA = [
  { rubro: 'celulares', art: 'Tu próximo', palabra: 'Celular', fondo: '#17406B' },
  { rubro: 'parlantes', art: 'Tu próximo', palabra: 'Parlante', fondo: '#3D2C74' },
  { rubro: 'impresion', art: 'Tu próxima', palabra: 'Impresora', fondo: '#0F1B2D' },
  { rubro: 'mouses', art: 'Tu próximo', palabra: 'Teclado', fondo: '#1C4E6E' },
  { rubro: 'memorias', art: 'Tu próximo', palabra: 'Pendrive', fondo: '#16504A' },
  { rubro: 'camaras', art: 'Tu próxima', palabra: 'Cámara', fondo: '#244A8C' },
  { rubro: 'tintas', art: 'Tus próximas', palabra: 'Tintas', fondo: '#6E2340' },
];
let vidTimer = null;
function vidSlides() {
  return VIDRIERA.map(v => {
    const r = RUBRO[v.rubro], ps = DATA.productos.filter(p => p.rubro === v.rubro);
    if (!r || !ps.length) return null;
    const img = v.rubro === 'celulares' ? ((DATA.vidriera || [])[0] || {}).rec : r.rec;
    if (!img) return null;
    let bots;
    if (v.rubro === 'celulares') bots = ['iPhone', 'Samsung', 'Motorola', 'Xiaomi'].map(m => [m, ps.filter(p => p.sub === m).length]).filter(x => x[1]).slice(0, 4).map(([m, n]) => ({ s: m, t: m, n: n + (n === 1 ? ' modelo' : ' modelos') }));
    else {
      const subs = [...new Set(ps.map(p => p.sub).filter(Boolean))].map(s2 => [s2, ps.filter(p => p.sub === s2).length]).sort((a, b) => b[1] - a[1]).slice(0, 3);
      bots = subs.map(([s2, n]) => ({ s: s2, t: s2.replace(/^Combos? teclado y mouse$/i, 'Combos').replace(/^Cartuchos de tinta$/i, 'Cartuchos').replace(/^Botellas de tinta$/i, 'Botellas').replace(/^Adaptadores Wi-Fi$/i, 'Adaptadores').replace(/^Tarjetas de memoria$/i, 'Micro SD').replace(/^Combos gamer$/i, 'Gamer').replace(/^Cámaras Wi-Fi$/i, 'Cámaras').replace(/^Repetidores$/i, 'Repetidor'), n: n + (n === 1 ? ' producto' : ' productos') }));
      bots.push({ s: 'Todos', t: 'Ver todo', n: ps.length + ' en total', todo: true });
    }
    return { ...v, img, n: ps.length, bots };
  }).filter(Boolean);
}
function vidriera() {
  const sl = vidSlides();
  if (!sl.length) return '';
  return `<section class="vidriera" id="vid" aria-label="Destacados" aria-roledescription="carrusel" style="--vbg:${sl[0].fondo}">
    <div class="vbar" aria-hidden="true">${sl.map((_, i) => `<i><b></b></i>`).join('')}</div>
    <div class="vcuerpo">
      <a class="vt" id="vid-link" href="#${sl[0].rubro}"><h2><span id="vid-art">${sl[0].art}</span><span class="vrol" id="vid-rol"><span>${esc(sl[0].palabra)}</span></span></h2><span class="vver" id="vid-ver"></span></a>
      <span class="vimg" id="vid-img" aria-hidden="true"><span class="vsol"></span><img src="${sl[0].img}" alt="" class="entra"></span>
    </div>
    <div class="vbot" id="vid-bot" role="group"></div>
  </section>`;
}
function montarVidriera() {
  const el = $('vid'); if (!el) return;
  const sl = vidSlides(), T = 4200, quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = 0, pausa = false, t0 = 0;
  el.style.setProperty('--vt', T + 'ms');
  const barras = [...el.querySelectorAll('.vbar i')];
  const botones = s2 => s2.bots.map(b => `<button type="button" class="${b.todo ? 'todo' : ''}" data-s="${esc(b.s)}" data-r="${s2.rubro}"><span>${esc(b.t)}</span><small>${esc(b.n)}</small></button>`).join('');
  const pintar = (i, primera) => {
    const s2 = sl[i];
    barras.forEach((b, j) => { b.className = j < i ? 'ok' : ''; b.firstChild.style.animation = 'none'; void b.offsetWidth; b.firstChild.style.animation = ''; });
    if (barras[i]) barras[i].className = 'ya';
    el.style.setProperty('--vbg', s2.fondo);
    $('vid-link').href = '#' + s2.rubro;
    $('vid-ver').innerHTML = `Ver los ${s2.n} ${s2.rubro === 'celulares' ? 'modelos' : (s2.n === 1 ? 'producto' : 'productos')} ${ico('chev', 14, 2.6)}`;
    $('vid-bot').innerHTML = botones(s2);
    $('vid-bot').querySelectorAll('button').forEach(b => b.onclick = () => { marcaPend = b.dataset.s; location.hash = '#' + b.dataset.r; });
    if (primera) return;
    $('vid-art').textContent = s2.art;
    const rol = $('vid-rol'), viejo = rol.querySelector('span:not(.sale)');
    if (viejo) { viejo.className = 'sale'; setTimeout(() => viejo.remove(), 420); }
    rol.insertAdjacentHTML('beforeend', `<span class="entra">${esc(s2.palabra)}</span>`);
    const caja = $('vid-img'), vi = caja.querySelector('img:not(.sale)');
    if (vi) { vi.className = 'sale'; setTimeout(() => vi.remove(), 460); }
    caja.insertAdjacentHTML('beforeend', `<img src="${s2.img}" alt="" class="entra">`);
    el.classList.add('cambia'); setTimeout(() => el.classList.remove('cambia'), 900);
  };
  const ir = d => { k = (k + d + sl.length) % sl.length; pintar(k); t0 = performance.now(); };
  pintar(0, true); t0 = performance.now();
  clearInterval(vidTimer);
  if (sl.length > 1 && !quieto) vidTimer = setInterval(() => {
    if (!document.body.contains(el)) { clearInterval(vidTimer); return; }
    if (!pausa && performance.now() - t0 >= T) ir(1);
  }, 120);
  // tocar y mantener = pausa; deslizar = pasar
  let x0 = null, y0 = 0, tp = 0, desliz = false;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; tp = performance.now(); pausa = true; el.classList.add('pausa'); });
  const soltar = e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0, dt = performance.now() - tp;
    pausa = false; el.classList.remove('pausa');
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { desliz = true; ir(dx < 0 ? 1 : -1); }
    else if (dt > 350) t0 += dt;   // lo que estuvo pausado no cuenta
    x0 = null;
  };
  el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', soltar); el.addEventListener('pointerleave', soltar);
  el.addEventListener('click', e => { if (desliz) { e.preventDefault(); e.stopPropagation(); desliz = false; } }, true);
}
function sugerencias() {
  const ok = SUGERENCIAS.filter(q => { const w = norm(q).split(/\s+/); return DATA.productos.some(p => w.every(x => norm(p.nombre + ' ' + (p.sub || '') + ' ' + (p.det || '')).includes(x))); }).slice(0, 6);
  return ok.length ? `<div class="subs sugs" role="group" aria-label="Búsquedas rápidas"><span class="sug-t">Probá:</span>${ok.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : '';
}
function infoLocal() {
  const fila = (i, t, d) => d ? `<div class="lf"><span class="li">${i}</span><span><b>${t}</b>${esc(d)}</span></div>` : '';
  return `<section class="local"><p class="label">Nuestro local</p><div class="lcard">
    ${fila('📍', 'Dirección', LOCAL.direccion)}${fila('🕘', 'Horario', LOCAL.horario)}${fila('💳', 'Formas de pago', LOCAL.pagos)}${fila('🚚', 'Envíos', LOCAL.envios)}
    <div class="lbtn"><a class="btn-sec" href="${LOCAL.mapa}" target="_blank" rel="noopener">Cómo llegar</a><a class="btn-wa" href="${wa('Hola TODO PC! Tengo una consulta.')}" target="_blank" rel="noopener">${ico('chat', 16, 2.4)}Escribinos</a></div>
  </div></section>`;
}

/* Vistas */
function celCard() {
  const r = RUBRO.celulares, ps = DATA.productos.filter(p => p.rubro === 'celulares');
  if (!r || !ps.length) return '';
  const imgs = (DATA.vidriera || []).slice(0, 2).map(v => v.rec).filter(Boolean);
  if (!imgs.length && r.rec) imgs.push(r.rec);
  const marcas = ['iPhone', 'Samsung', 'Motorola', 'Xiaomi', 'Usados'].map(m => [m, ps.filter(p => p.sub === m).length]).filter(x => x[1]);
  return `<section class="celcard" aria-label="Celulares">
    <a class="cc-top" href="#celulares"><span class="cc-txt"><b>Celulares</b><small>${ps.length} modelos</small><span class="cc-ver">Ver todos ${ico('chev', 14, 2.6)}</span></span><span class="cc-img" aria-hidden="true">${imgs.map(i => `<img src="${i}" alt="">`).join('')}</span></a>
    <div class="cc-marcas n${marcas.length}" role="group" aria-label="Marcas">${marcas.map(([m, n]) => `<button type="button" data-s="${esc(m)}"><span>${esc(m)}</span><small>${n} ${n === 1 ? 'modelo' : 'modelos'}</small></button>`).join('')}</div>
  </section>`;
}
function vInicio() {
  const nuevos = DATA.productos.filter(p => p.tag === 'ingresa' || p.nuevo).slice(0, 8);
  vista.innerHTML = `
    ${vidriera()}
    <section style="display:flex;flex-direction:column;gap:10px"><h1 style="font-size:22px">¿Qué estás buscando?</h1>${sugerencias()}</section>
    ${celCard()}
    <section class="tiles" aria-label="Rubros">${(() => { const rs = DATA.rubros.filter(r => r.inicio && r.id !== 'celulares'); return rs.map((r, i) => {
      const n = DATA.productos.filter(p => p.rubro === r.id).length;
      const img = r.rec || (r.portada && BY_ID[r.portada] && BY_ID[r.portada].foto);
      const ult = rs.length % 2 === 1 && i === rs.length - 1;
      return `<a class="tile${ult ? ' ult' : ''}" href="#${r.id}" style="--tint:${r.tint || '#E3ECF7'}"><span class="tim">${img ? `<img src="${img}" alt="" loading="lazy">` : `<span class="ico-big">${ico(r.icon || r.id, 30, 1.8)}</span>`}</span><span class="tpie"><b>${esc(r.nombre).replace('Wi-Fi', 'Wi\u2011Fi')}</b><small>${n} ${n === 1 ? 'producto' : 'productos'}</small><span class="go" aria-hidden="true">${ico('chev', 15, 2.6)}</span></span></a>`;
    }).join(''); })()}</section>
    <a class="all-btn" href="#rubros" style="margin-top:-12px"><span>${ico('todos', 20)}Ver todos los rubros</span><em>${DATA.rubros.length} ${ico('chev', 16, 2.4)}</em></a>
    ${infoLocal()}
    ${nuevos.length ? `<section><p class="label">Recién ingresados</p><div class="recent">${nuevos.map(itemLista).join('')}</div></section>` : ''}`;
  vista.querySelectorAll('.recent .item').forEach((el, i) => el.style.borderTop = i ? '' : '0');
  montarVidriera();
  vista.querySelectorAll('.cc-marcas button').forEach(b => b.onclick = () => { marcaPend = b.dataset.s; location.hash = '#celulares'; });
  vista.querySelectorAll('.sugs button').forEach(b => b.onclick = () => { buscar.value = b.dataset.q; buscar.dispatchEvent(new Event('input')); buscar.focus(); });
}

function vRubros() {
  vista.innerHTML = `
    <section style="display:flex;flex-direction:column;gap:12px"><a class="crumb" href="#inicio">${ico('back', 18, 2.4)}Volver</a><h1>Todos los rubros</h1></section>
    <section class="rlist">${DATA.rubros.map(r => {
      const ps = DATA.productos.filter(p => p.rubro === r.id);
      const subs = [...new Set(ps.map(p => p.sub).filter(Boolean))];
      return `<a class="rrow" href="#${r.id}" style="--tint:${r.dark ? '#FFF1CF' : (r.tint || '#E8F0FA')}"><span class="ic">${r.rec ? `<img src="${r.rec}" alt="">` : ico(r.icon || r.id, 22, 1.9)}</span><span class="tx"><b>${esc(r.nombre)}</b><small>${esc(subs.join(' · ') || ' ')}</small></span><span class="n">${ps.length}</span><span class="chev">${ico('chev', 18, 2.4)}</span></a>`;
    }).join('')}</section>`;
}

function vRubro(id) {
  const r = RUBRO[id];
  const todos = DATA.productos.filter(p => p.rubro === id);
  const subs = [...new Set(todos.map(p => p.sub).filter(Boolean))];
  if (!['Todos', ...subs].includes(subSel)) subSel = 'Todos';
  const ps = ordenar(subSel === 'Todos' ? todos : todos.filter(p => p.sub === subSel));
  const demo = todos.every(p => p.tag === 'ejemplo');
  vista.innerHTML = `
    <section style="display:flex;flex-direction:column;gap:12px">
      <a class="crumb" href="#inicio">${ico('back', 18, 2.4)}Volver</a>
      <div class="rban" style="--tint:${r.tint || '#E3ECF7'}"><div class="rbt"><h1>${esc(r.nombre)}</h1><p class="sub">${todos.length} producto${todos.length === 1 ? '' : 's'}</p></div>
        ${r.rec ? `<img src="${r.rec}" alt="">` : ''}
        <button class="icon-btn" type="button" id="share" aria-label="Copiar link de ${esc(r.nombre)}">${ico('share', 20)}</button></div>
      ${subs.length > 1 ? `<div class="subs" role="group" aria-label="Tipo">${['Todos', ...subs].map(s => `<button type="button" data-s="${esc(s)}" aria-pressed="${s === subSel}">${esc(s)}</button>`).join('')}</div>` : ''}
      ${id === 'celulares' ? promoCel(subSel) : ''}
      ${demo ? '<div class="nota">Rubro de ejemplo. Se completa con los productos que marques en TODO PC Listas.</div>' : ''}
      ${herramientas()}
    </section>
    ${resultados(ps)}`;
  $('share').onclick = () => copiar(location.href.split('#')[0] + '#' + id, 'Link del rubro copiado');
  vista.querySelectorAll('.subs button').forEach(b => b.onclick = () => { subSel = b.dataset.s; vRubro(id); });
  conectarHerramientas(() => vRubro(id));
}

function vBuscar(q) {
  const ps = ordenar(buscarProductos(q));
  vista.innerHTML = `
    <section style="display:flex;flex-direction:column;gap:12px">
      <div><h1>Resultados para “${esc(q)}”</h1><p class="sub">${ps.length} producto${ps.length === 1 ? '' : 's'}</p></div>
      ${ps.length ? herramientas() : ''}
    </section>
    ${ps.length ? resultados(ps) : `<div class="vacio">No lo encontramos en el catálogo web, pero en el local tenemos más de mil productos.<a class="cta" href="${wa('Hola TODO PC! ¿Tienen ' + q + '?')}" target="_blank" rel="noopener">${ico('chat', 18, 2.4)}Preguntanos por “${esc(q)}”</a></div>`}`;
  if (ps.length) conectarHerramientas(() => vBuscar(q));
}

function vFicha(p) {
  const r = RUBRO[p.rubro];
  const otros = ordenar(DATA.productos.filter(x => x.rubro === p.rubro && x.id !== p.id && (x.sub === p.sub || !p.sub))).slice(0, 4);
  const pr = fmt(p.precio);
  vista.innerHTML = `
    <article class="ficha">
      <a class="crumb" href="#${r.id}">${ico('back', 18, 2.4)}${esc(r.nombre)}${p.sub ? ' · ' + esc(p.sub) : ''}</a>
      <div class="foto">${p.foto ? `<img src="${p.foto}" alt="${esc(p.nombre)}">` : `<div class="ph-vacio" style="width:50%;height:50%">${ico(p.rubro, 56, 1.5)}</div>`}</div>
      <div class="rh">
        <div class="datos">${badge(p)}<h1>${esc(p.nombre)}</h1>${p.det ? `<span class="dt">${esc(p.det)}</span>` : ''}
          ${pr ? `<span class="pr">${pr}</span><span class="cq">Contado / transferencia</span><span class="como">Se compra por WhatsApp: tocá <b>Consultá tu compra</b> y te respondemos con stock y formas de pago.</span>` : `<span class="pr sin" style="font-size:18px">${p.tag === 'ingresa' ? 'Ingresa muy pronto' : 'Consultá el precio'}</span>`}</div>
        <button class="icon-btn" type="button" id="share" aria-label="Copiar link de este producto">${ico('share', 20)}</button>
      </div>
      ${p.rubro === 'celulares' ? promoCel(p.sub) : ''}
      ${pr ? `<div class="pagos"><b>También en 3, 6 y 12 cuotas</b><div class="logos">${LOGOS.map(l => `<img src="${l.src}" alt="${l.alt}">`).join('')}</div></div>` : ''}
    </article>
    ${otros.length ? `<section><p class="label">Más en ${esc(p.sub || r.nombre)}</p><div class="list">${otros.map(itemLista).join('')}</div></section>` : ''}
    <div class="buy"><div class="wrap">
      <div class="mini"><span>${esc(p.nombre)}</span><b>${pr || (p.tag === 'ingresa' ? 'Muy pronto' : 'Consultar')}</b></div>
      <a class="cta" href="${wa(`Hola TODO PC! Me interesa: ${p.nombre}${p.det ? ' (' + p.det + ')' : ''}. ${linkProd(p)}`)}" target="_blank" rel="noopener">${ico('chat', 18, 2.4)}${p.tag === 'ingresa' ? 'Avisame' : 'Consultá tu compra'}</a>
    </div></div>`;
  $('share').onclick = () => copiar(linkProd(p), 'Link del producto copiado');
}

function copiar(t, m) { try { navigator.clipboard.writeText(t).then(() => toast(m)).catch(() => toast(t)); } catch (e) { toast(t); } }
let tt;
function toast(m) { const el = $('toast'); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2400); }

function router() {
  const h = location.hash.slice(1) || 'inicio';
  buscar.value = ''; $('limpiar').hidden = true;
  const tabSel = h.startsWith('p-') ? '' : (h === 'inicio' ? 'inicio' : 'rubros');
  ['inicio', 'rubros'].forEach(k => { const el = $('tab-' + k); if (k === tabSel) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current'); });
  vista.style.paddingBottom = h.startsWith('p-') ? '200px' : '';
  if (h.startsWith('p-') && BY_ID[h.slice(2)]) vFicha(BY_ID[h.slice(2)]);
  else if (h === 'rubros') vRubros();
  else if (RUBRO[h]) vRubro(h);
  else vInicio();
  window.scrollTo(0, 0);
}
let tq;
buscar.addEventListener('input', () => {
  const q = buscar.value.trim();
  $('limpiar').hidden = !q;
  clearTimeout(tq);
  tq = setTimeout(() => { if (q.length >= 2) { vBuscar(q); window.scrollTo(0, 0); } else if (!q) router(); }, 150);
});
$('limpiar').onclick = () => { buscar.value = ''; $('limpiar').hidden = true; router(); buscar.focus(); };
window.addEventListener('hashchange', () => { subSel = marcaPend || 'Todos'; marcaPend = null; router(); });
router();
</script>
